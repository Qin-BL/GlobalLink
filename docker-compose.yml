version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: globallink_postgres
    environment:
      POSTGRES_DB: globallink
      POSTGRES_USER: globallink_user
      POSTGRES_PASSWORD: globallink_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - globallink_network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: globallink_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - globallink_network
    restart: unless-stopped



  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globallink_backend
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=globallink_user
      - POSTGRES_PASSWORD=globallink_password
      - POSTGRES_DB=globallink
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
    depends_on:
      - postgres
      - redis
    networks:
      - globallink_network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globallink_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - globallink_network
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: globallink_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - backend_static:/var/www/static
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - globallink_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_static:

networks:
  globallink_network:
    driver: bridge